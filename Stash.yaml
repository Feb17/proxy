  cn-ip:
    behavior: ipcidr
    format: text
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/cn.list
    interval: 86400

# ------------------------------------------------------------
# 分流规则
# 顺序原则：纯域名规则在前，会触发 DNS 解析的 IP 规则放到最后，
# 减少不必要的 DNS 查询，并避免需要代理的域名先在本地被解析
# ------------------------------------------------------------
rules:
  # > 局域网 IP 直连（no-resolve：只匹配直接访问 IP 的请求，不触发 DNS）
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
  - IP-CIDR6,fe80::/10,DIRECT,no-resolve
  - IP-CIDR6,fc00::/7,DIRECT,no-resolve
  - IP-CIDR6,::1/128,DIRECT,no-resolve

  # > NTP 授时直连（按端口匹配：pool.ntp.org 被境外规则集收录，走代理会导致授时失败或不准）
  - DST-PORT,123,DIRECT

  # > 内网 / 路由器管理域名直连（*.lan、*.local、router.asus.com 等）
  - RULE-SET,private,DIRECT

  # > Emby 私有服
  - DOMAIN-SUFFIX,taotu.ink,Emby
  - DOMAIN-SUFFIX,okemby.org,Emby
  - DOMAIN-SUFFIX,uhdnow.com,Emby
  - DOMAIN-SUFFIX,entertang.work,Emby

  # > 苹果推送 APNs 走代理，解决部分海外应用收不到推送（网段来自 Stash 文档 / Apple 官方）
  - DOMAIN-SUFFIX,push.apple.com,Proxy
  - IP-CIDR,17.249.0.0/16,Proxy,no-resolve
  - IP-CIDR,17.252.0.0/16,Proxy,no-resolve
  - IP-CIDR,17.57.144.0/22,Proxy,no-resolve
  - IP-CIDR,17.188.128.0/18,Proxy,no-resolve
  - IP-CIDR,17.188.20.0/23,Proxy,no-resolve
  - IP-CIDR6,2620:149:a44::/48,Proxy,no-resolve
  - IP-CIDR6,2403:300:a42::/48,Proxy,no-resolve
  - IP-CIDR6,2403:300:a51::/48,Proxy,no-resolve
  - IP-CIDR6,2a01:b740:a42::/48,Proxy,no-resolve

  # > 智能助手（ChatGPT / Claude / Gemini / Copilot / Grok / Perplexity / Cursor 等）
  # 放在 GitHub、微软、流媒体规则之前，避免 Copilot 等域名被它们截走
  - RULE-SET,ai,Intelligence

  # > 苹果服务
  - RULE-SET,apple,Apple

  # > 社交平台（Telegram 客户端会直连 IP，IP 规则集加 no-resolve）
  - RULE-SET,telegram,Telegram
  - RULE-SET,telegram-ip,Telegram,no-resolve

  # > 开发平台
  - RULE-SET,github,Proxy

  # > 微软生态
  - RULE-SET,microsoft,Microsoft

  # > 游戏生态
  - RULE-SET,steam,Gamer
  - RULE-SET,epicgames,Gamer
  - RULE-SET,playstation,Gamer
  - RULE-SET,nintendo,Gamer

  # > 流媒体平台
  - RULE-SET,youtube,YouTube
  - RULE-SET,netflix,Netflix
  - RULE-SET,netflix-ip,Netflix,no-resolve
  - RULE-SET,disney,Disney+
  - RULE-SET,spotify,Spotify
  - RULE-SET,tiktok,TikTok
  - RULE-SET,bilibili,BiliBili
  - RULE-SET,globalmedia,GlobalMedia

  # > 常见境外服务（geolocation-!cn）
  - RULE-SET,proxy,Proxy

  # > 大陆域名直连（geosite:cn）
  - RULE-SET,cn,DIRECT

  # > 局域网与国内 IP 兜底（会触发 DNS 解析，放在所有域名规则之后）
  # 用 ipcidr 规则集代替 GEOIP，不依赖 App 内 GeoIP 数据库的版本
  - RULE-SET,private-ip,DIRECT
  - RULE-SET,cn-ip,DIRECT

  # > 最终兜底
  - MATCH,Proxy
